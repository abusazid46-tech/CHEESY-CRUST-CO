<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offers & Promos - Admin Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="admin-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img src="https://i.ibb.co/1JQyJGfH/logo.png" alt="Logo">
      <h4>Cheesy Crust Co.</h4>
      <p>Admin Panel</p>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html"><i class="fas fa-th-large"></i> Dashboard</a>
      <a href="orders.html"><i class="fas fa-receipt"></i> Orders</a>
      <a href="menu-management.html"><i class="fas fa-utensils"></i> Menu Management</a>
      <a href="reservations.html"><i class="fas fa-calendar-check"></i> Reservations</a>
      <a href="customers.html"><i class="fas fa-users"></i> Customers</a>
      <a href="reviews.html"><i class="fas fa-star"></i> Reviews</a>
      <a href="offers-promos.html" class="active"><i class="fas fa-tags"></i> Offers & Promos</a>
      <a href="analytics.html"><i class="fas fa-chart-bar"></i> Analytics</a>
      <a href="settings.html"><i class="fas fa-cog"></i> Settings</a>
    </nav>
    <div class="p-3">
      <button class="btn-outline w-100" onclick="adminLogout()" style="border-color: #dc3545; color: #dc3545;">
        <i class="fas fa-sign-out-alt me-2"></i> Logout
      </button>
    </div>
  </aside>
  
  <div class="main-content">
    <header class="admin-header">
      <h5><i class="fas fa-tags me-2" style="color: var(--gold);"></i>Offers & Promotions</h5>
      <button class="btn-gold" onclick="openAddOfferModal()">
        <i class="fas fa-plus me-2"></i>Create Offer
      </button>
    </header>
    
    <div class="content-area">
      <div class="row g-4" id="offersContainer">
      </div>
    </div>
  </div>
</div>

<!-- Add Offer Modal -->
<div class="modal fade admin-modal" id="offerModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Create Offer</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="offerForm" class="admin-form">
          <div class="mb-3">
            <label>Offer Title *</label>
            <input type="text" class="form-control" id="offerTitle" placeholder="e.g., Weekend Special" required>
          </div>
          <div class="mb-3">
            <label>Description</label>
            <textarea class="form-control" id="offerDesc" rows="2" placeholder="Offer details..."></textarea>
          </div>
          <div class="mb-3">
            <label>Offer Banner Image URL</label>
            <input type="url" class="form-control" id="offerImageUrl" placeholder="https://example.com/offer-banner.jpg">
            <small class="text-muted">This image appears in the mobile app hero banner.</small>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label>Discount Type</label>
              <select class="form-select" id="offerDiscountType">
                <option value="percentage">Percentage (%)</option>
                <option value="flat">Flat Amount (₹)</option>
                <option value="bogo">Buy One Get One</option>
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label>Discount Value</label>
              <input type="number" class="form-control" id="offerDiscountValue" value="10">
            </div>
          </div>
          <div class="mb-3">
            <label>Promo Code (Optional)</label>
            <input type="text" class="form-control" id="offerCode" placeholder="e.g., CHEESY20">
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label>Valid From</label>
              <input type="date" class="form-control" id="offerStart">
            </div>
            <div class="col-md-6 mb-3">
              <label>Valid Until</label>
              <input type="date" class="form-control" id="offerEnd">
            </div>
          </div>
          <div class="mb-3">
            <label>Min Order Amount (₹)</label>
            <input type="number" class="form-control" id="offerMinOrder" value="0">
          </div>
          <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" id="offerActive" checked>
            <label class="form-check-label">Active</label>
          </div>
        </form>
      </div>
      <div class="modal-footer" style="border-top: 1px solid rgba(205,164,94,0.15);">
        <button class="btn-outline" data-bs-dismiss="modal">Cancel</button>
        <button class="btn-gold" onclick="saveOffer()">Save Offer</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/admin-api.js"></script>
<script src="js/offers.js"></script>
</body>
</html>
