<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Management - Admin Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="admin-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img src="https://i.ibb.co/1JQyJGfH/logo.png" alt="Logo">
      <h4>Cheesy Crust Co.</h4>
      <p>Admin Panel</p>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html"><i class="fas fa-th-large"></i> Dashboard</a>
      <a href="orders.html"><i class="fas fa-receipt"></i> Orders</a>
      <a href="menu-management.html" class="active"><i class="fas fa-utensils"></i> Menu Management</a>
      <a href="reservations.html"><i class="fas fa-calendar-check"></i> Reservations</a>
      <a href="customers.html"><i class="fas fa-users"></i> Customers</a>
      <a href="reviews.html"><i class="fas fa-star"></i> Reviews</a>
      <a href="offers-promos.html"><i class="fas fa-tags"></i> Offers & Promos</a>
      <a href="analytics.html"><i class="fas fa-chart-bar"></i> Analytics</a>
      <a href="settings.html"><i class="fas fa-cog"></i> Settings</a>
    </nav>
    <div class="p-3">
      <button class="btn-outline w-100" onclick="adminLogout()" style="border-color: #dc3545; color: #dc3545;">
        <i class="fas fa-sign-out-alt me-2"></i> Logout
      </button>
    </div>
  </aside>
  
  <div class="main-content">
    <header class="admin-header">
      <h5><i class="fas fa-utensils me-2" style="color: var(--gold);"></i>Menu Management</h5>
      <button class="btn-gold" onclick="openAddMenuItemModal()">
        <i class="fas fa-plus me-2"></i>Add New Item
      </button>
    </header>
    
    <div class="content-area">
      <div class="chart-container">
        <div class="table-responsive">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Image</th>
                <th>Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Available</th>
                <th>Rating</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="menuTable">
              <tr><td colspan="7" class="text-center text-muted">Loading menu...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Menu Modal -->
<div class="modal fade admin-modal" id="menuItemModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Add Menu Item</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="menuItemForm" class="admin-form">
          <input type="hidden" id="itemId">
          <div class="mb-3">
            <label>Item Name *</label>
            <input type="text" class="form-control" id="itemName" required>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label>Category *</label>
              <select class="form-select" id="itemCategory" required>
                <option value="breakfast">Breakfast</option>
                <option value="lunch">Lunch</option>
                <option value="dinner">Dinner</option>
                <option value="starter">Starter</option>
                <option value="dessert">Dessert</option>
                <option value="beverage">Beverage</option>
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label>Price (₹) *</label>
              <input type="number" class="form-control" id="itemPrice" min="1" required>
            </div>
          </div>
          <div class="mb-3">
            <label>Description *</label>
            <textarea class="form-control" id="itemDescription" rows="3" required></textarea>
          </div>
          <div class="mb-3">
            <label>Image URL *</label>
            <input type="url" class="form-control" id="itemImage" required>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <div class="form-check">
                <input type="checkbox" class="form-check-input" id="itemVeg" checked>
                <label class="form-check-label">Vegetarian</label>
              </div>
            </div>
            <div class="col-md-6 mb-3">
              <div class="form-check">
                <input type="checkbox" class="form-check-input" id="itemAvailable" checked>
                <label class="form-check-label">Available</label>
              </div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer" style="border-top: 1px solid rgba(205,164,94,0.15);">
        <button class="btn-outline" data-bs-dismiss="modal">Cancel</button>
        <button class="btn-gold" onclick="saveMenuItem()">Save Item</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/admin-api.js"></script>
<script src="js/menu-management.js"></script>
</body>
</html>
