<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics - Admin Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="admin-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img src="https://i.ibb.co/1JQyJGfH/logo.png" alt="Logo">
      <h4>Cheesy Crust Co.</h4>
      <p>Admin Panel</p>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html"><i class="fas fa-th-large"></i> Dashboard</a>
      <a href="orders.html"><i class="fas fa-receipt"></i> Orders</a>
      <a href="menu-management.html"><i class="fas fa-utensils"></i> Menu Management</a>
      <a href="reservations.html"><i class="fas fa-calendar-check"></i> Reservations</a>
      <a href="customers.html"><i class="fas fa-users"></i> Customers</a>
      <a href="reviews.html"><i class="fas fa-star"></i> Reviews</a>
      <a href="offers-promos.html"><i class="fas fa-tags"></i> Offers & Promos</a>
      <a href="analytics.html" class="active"><i class="fas fa-chart-bar"></i> Analytics</a>
      <a href="settings.html"><i class="fas fa-cog"></i> Settings</a>
    </nav>
    <div class="p-3">
      <button class="btn-outline w-100" onclick="adminLogout()" style="border-color: #dc3545; color: #dc3545;">
        <i class="fas fa-sign-out-alt me-2"></i> Logout
      </button>
    </div>
  </aside>
  
  <div class="main-content">
    <header class="admin-header">
      <h5><i class="fas fa-chart-bar me-2" style="color: var(--gold);"></i>Sales Analytics</h5>
      <select class="form-select" id="periodSelect" onchange="loadAnalytics()" 
              style="background: var(--card-light); color: #fff; border-color: #3a352e; width: 150px;">
        <option value="day">Today</option>
        <option value="week" selected>This Week</option>
        <option value="month">This Month</option>
      </select>
    </header>
    
    <div class="content-area">
      <!-- Revenue Chart -->
      <div class="chart-container">
        <h6 style="color: var(--gold);">Revenue Trend</h6>
        <canvas id="revenueChart" height="80"></canvas>
      </div>
      
      <!-- Top Items -->
      <div class="row g-4">
        <div class="col-md-6">
          <div class="chart-container">
            <h6 style="color: var(--gold);">Top Selling Items</h6>
            <canvas id="topItemsChart" height="60"></canvas>
          </div>
        </div>
        <div class="col-md-6">
          <div class="chart-container">
            <h6 style="color: var(--gold);">Order Type Distribution</h6>
            <canvas id="orderTypeChart" height="60"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="js/admin-api.js"></script>
<script src="js/analytics.js"></script>
</body>
</html>
