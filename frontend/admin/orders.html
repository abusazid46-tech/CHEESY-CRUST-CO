<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders - Admin Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="admin-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img src="https://i.ibb.co/1JQyJGfH/logo.png" alt="Logo">
      <h4>Cheesy Crust Co.</h4>
      <p>Admin Panel</p>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html"><i class="fas fa-th-large"></i> Dashboard</a>
      <a href="orders.html" class="active"><i class="fas fa-receipt"></i> Orders</a>
      <a href="menu-management.html"><i class="fas fa-utensils"></i> Menu Management</a>
      <a href="reservations.html"><i class="fas fa-calendar-check"></i> Reservations</a>
      <a href="customers.html"><i class="fas fa-users"></i> Customers</a>
      <a href="reviews.html"><i class="fas fa-star"></i> Reviews</a>
      <a href="offers-promos.html"><i class="fas fa-tags"></i> Offers & Promos</a>
      <a href="analytics.html"><i class="fas fa-chart-bar"></i> Analytics</a>
      <a href="settings.html"><i class="fas fa-cog"></i> Settings</a>
    </nav>
    <div class="p-3">
      <button class="btn-outline w-100" onclick="adminLogout()" style="border-color: #dc3545; color: #dc3545;">
        <i class="fas fa-sign-out-alt me-2"></i> Logout
      </button>
    </div>
  </aside>
  
  <div class="main-content">
    <header class="admin-header">
      <h5><i class="fas fa-receipt me-2" style="color: var(--gold);"></i>Order Management</h5>
      <div class="header-actions">
        <button class="btn-icon" onclick="document.getElementById('sidebar').classList.toggle('open')">
          <i class="fas fa-bars"></i>
        </button>
      </div>
    </header>
    
    <div class="content-area">
      <!-- Filters -->
      <div class="row g-3 mb-4">
        <div class="col-md-3">
          <select class="form-select" id="statusFilter" onchange="loadOrders()" style="background: var(--card-light); color: #fff; border-color: #3a352e;">
            <option value="">All Statuses</option>
            <option value="pending">Pending</option>
            <option value="confirmed">Confirmed</option>
            <option value="preparing">Preparing</option>
            <option value="ready">Ready</option>
            <option value="out_for_delivery">Out for Delivery</option>
            <option value="delivered">Delivered</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
        <div class="col-md-3">
          <input type="text" class="form-control" id="searchOrder" placeholder="Search order #..." style="background: var(--card-light); color: #fff; border-color: #3a352e;">
        </div>
      </div>
      
      <!-- Orders Table -->
      <div class="chart-container">
        <div class="table-responsive">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Order #</th>
                <th>Customer</th>
                <th>Type</th>
                <th>Items</th>
                <th>Total</th>
                <th>Payment</th>
                <th>Status</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="ordersTable">
              <tr><td colspan="9" class="text-center text-muted">Loading orders...</td></tr>
            </tbody>
          </table>
        </div>
        <div class="d-flex justify-content-between align-items-center mt-3" id="pagination">
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Order Detail Modal -->
<div class="modal fade admin-modal" id="orderDetailModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Order Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="orderDetailContent">
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/admin-api.js"></script>
<script src="js/orders.js"></script>
</body>
</html>
