<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Cheesy Crust Co.</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/admin.css">
  <style>
    body {
      background: linear-gradient(135deg, #0c0b09 0%, #1a1814 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
      padding: 20px;
    }
    .login-card {
      background: #1a1814;
      border-radius: 24px;
      padding: 3rem 2rem;
      border: 1px solid rgba(205,164,94,0.2);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .login-logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-logo img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin-bottom: 1rem;
    }
    .login-logo h2 {
      font-family: 'Playfair Display', serif;
      color: #cda45e;
      font-size: 1.8rem;
    }
    .login-logo p {
      color: #888;
      font-size: 0.9rem;
    }
    .form-control {
      background: #0c0b09;
      border: 1px solid #3a352e;
      color: #fff;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 1rem;
      transition: all 0.3s;
    }
    .form-control:focus {
      background: #1a1814;
      border-color: #cda45e;
      box-shadow: 0 0 0 3px rgba(205,164,94,0.15);
      color: #fff;
    }
    .input-group-text {
      background: #0c0b09;
      border: 1px solid #3a352e;
      color: #cda45e;
      border-radius: 12px 0 0 12px;
    }
    .btn-admin-login {
      background: linear-gradient(135deg, #cda45e, #b58d4a);
      color: #0c0b09;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      width: 100%;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
    }
    .btn-admin-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(205,164,94,0.3);
    }
    .alert {
      border-radius: 12px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="login-card">
    <div class="login-logo">
      <img src="https://i.ibb.co/1JQyJGfH/logo.png" alt="Cheesy Crust Co.">
      <h2>Admin Panel</h2>
      <p>Secure Login</p>
    </div>
    
    <form id="adminLoginForm">
      <div class="mb-3">
        <label class="form-label" style="color: #cda45e;">
          <i class="fas fa-envelope me-2"></i>Email Address
        </label>
        <input type="email" class="form-control" id="adminEmail" 
               placeholder="admin@cheesycrust.co" required>
      </div>
      
      <div class="mb-3">
        <label class="form-label" style="color: #cda45e;">
          <i class="fas fa-lock me-2"></i>Password
        </label>
        <div class="input-group">
          <input type="password" class="form-control" id="adminPassword" 
                 placeholder="Enter password" required>
          <button class="btn btn-outline-secondary" type="button" id="togglePassword"
                  style="background: #0c0b09; border-color: #3a352e; color: #888; border-radius: 0 12px 12px 0;">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>
      
      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="rememberMe">
        <label class="form-check-label" for="rememberMe" style="color: #888;">Remember me</label>
      </div>
      
      <button type="submit" class="btn-admin-login" id="loginBtn">
        <i class="fas fa-sign-in-alt me-2"></i>Sign In
      </button>
    </form>
    
    <div id="messageBox" class="mt-3 text-center" style="font-size: 0.85rem;"></div>
  </div>
  
  <div class="text-center mt-3">
    <a href="../index.html" style="color: #888; text-decoration: none;">
      <i class="fas fa-arrow-left me-1"></i>Back to Restaurant
    </a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/admin-api.js?v=2"></script>
<script src="js/admin-auth.js?v=2"></script>
</body>
</html>
