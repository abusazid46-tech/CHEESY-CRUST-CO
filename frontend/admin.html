<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin CRM - Cheesy Crust Co.</title>
    
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #cda45e;
            --gold-dark: #b58d4a;
            --dark-bg: #0c0b09;
            --card-bg: #1a1814;
            --card-light: #2a2621;
            --sidebar-bg: #0f0d0a;
            --text-light: #eeeeee;
            --text-muted: #999;
            --success: #28a745;
            --warning: #ffc107;
            --danger: #dc3545;
            --info: #17a2b8;
        }

        body {
            background: var(--dark-bg);
            font-family: 'Inter', 'Open Sans', sans-serif;
            color: var(--text-light);
            overflow-x: hidden;
        }

        /* ========== SIDEBAR ========== */
        .admin-wrapper {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            border-right: 1px solid rgba(205,164,94,0.15);
            transition: all 0.3s ease;
            z-index: 1000;
            overflow-y: auto;
        }

        .sidebar-logo {
            padding: 25px 20px;
            border-bottom: 1px solid rgba(205,164,94,0.15);
            text-align: center;
        }

        .sidebar-logo img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
        }

        .sidebar-logo h5 {
            color: var(--gold);
            margin-top: 10px;
            font-size: 1rem;
        }

        .sidebar-menu {
            padding: 20px 0;
        }

        .sidebar-menu .nav-item {
            list-style: none;
        }

        .sidebar-menu .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 25px;
            color: #bbb;
            text-decoration: none;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .sidebar-menu .nav-link:hover,
        .sidebar-menu .nav-link.active {
            background: rgba(205,164,94,0.08);
            color: var(--gold);
            border-left-color: var(--gold);
        }

        .sidebar-menu .nav-link i {
            width: 20px;
            text-align: center;
            font-size: 1.1rem;
        }

        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid rgba(205,164,94,0.15);
            position: absolute;
            bottom: 0;
            width: 100%;
        }

        /* ========== MAIN CONTENT ========== */
        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 30px;
            min-height: 100vh;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .page-header h2 {
            color: var(--gold);
            font-weight: 700;
        }

        /* ========== STAT CARDS ========== */
        .stat-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid rgba(205,164,94,0.1);
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            border-color: var(--gold);
            box-shadow: 0 8px 25px rgba(205,164,94,0.08);
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 15px;
        }

        .stat-icon.gold { background: rgba(205,164,94,0.15); color: var(--gold); }
        .stat-icon.green { background: rgba(40,167,69,0.15); color: var(--success); }
        .stat-icon.blue { background: rgba(23,162,184,0.15); color: var(--info); }
        .stat-icon.red { background: rgba(220,53,69,0.15); color: var(--danger); }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* ========== TABLES ========== */
        .admin-table {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(205,164,94,0.1);
        }

        .admin-table th {
            background: rgba(205,164,94,0.08);
            color: var(--gold);
            font-weight: 600;
            border: none;
            padding: 15px;
        }

        .admin-table td {
            padding: 15px;
            vertical-align: middle;
            border-color: rgba(205,164,94,0.05);
            color: #ddd;
        }

        .admin-table tbody tr:hover {
            background: rgba(205,164,94,0.03);
        }

        /* ========== BADGES ========== */
        .badge-status {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-pending { background: rgba(255,193,7,0.2); color: #ffc107; }
        .badge-confirmed { background: rgba(23,162,184,0.2); color: #17a2b8; }
        .badge-preparing { background: rgba(23,162,184,0.2); color: #17a2b8; }
        .badge-ready { background: rgba(40,167,69,0.2); color: #28a745; }
        .badge-out_for_delivery { background: rgba(0,123,255,0.2); color: #0d6efd; }
        .badge-delivered,
        .badge-completed { background: rgba(40,167,69,0.2); color: #28a745; }
        .badge-cancelled { background: rgba(220,53,69,0.2); color: #dc3545; }

        .badge-paid { background: rgba(40,167,69,0.2); color: #28a745; }

        /* ========== SEARCH & FILTERS ========== */
        .search-box {
            background: var(--card-bg);
            border: 1px solid #3a352e;
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            transition: all 0.2s;
        }

        .search-box:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(205,164,94,0.1);
            outline: none;
        }

        .filter-select {
            background: var(--card-bg);
            border: 1px solid #3a352e;
            color: white;
            padding: 10px 15px;
            border-radius: 12px;
        }

        .filter-select:focus {
            border-color: var(--gold);
            outline: none;
        }

        /* ========== MODALS ========== */
        .admin-modal .modal-content {
            background: var(--card-bg);
            color: white;
            border: 1px solid rgba(205,164,94,0.3);
            border-radius: 20px;
        }

        .admin-modal .modal-header {
            border-bottom: 1px solid rgba(205,164,94,0.15);
        }

        .admin-modal .modal-footer {
            border-top: 1px solid rgba(205,164,94,0.15);
        }

        .admin-modal .form-control {
            background: var(--dark-bg);
            border: 1px solid #3a352e;
            color: white;
            border-radius: 12px;
            padding: 10px 15px;
        }

        .admin-modal .form-control:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(205,164,94,0.1);
            background: var(--card-light);
            color: white;
        }

        .admin-modal .btn-close {
            filter: invert(1);
        }

        /* ========== BUTTONS ========== */
        .btn-gold {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: #0c0b09;
            border: none;
            padding: 10px 24px;
            font-weight: 600;
            border-radius: 40px;
            transition: all 0.3s;
        }

        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(205,164,94,0.3);
            color: #0c0b09;
        }

        .btn-outline-gold {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 10px 24px;
            border-radius: 40px;
            transition: all 0.3s;
        }

        .btn-outline-gold:hover {
            background: var(--gold);
            color: #0c0b09;
        }

        .btn-sm-action {
            background: rgba(205,164,94,0.1);
            border: 1px solid rgba(205,164,94,0.3);
            color: var(--gold);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-sm-action:hover {
            background: var(--gold);
            color: #0c0b09;
        }

        /* ========== TABS ========== */
        .admin-tabs {
            display: flex;
            gap: 10px;
            border-bottom: 1px solid rgba(205,164,94,0.15);
            padding-bottom: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .admin-tab {
            background: transparent;
            border: 1px solid rgba(205,164,94,0.3);
            color: #bbb;
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .admin-tab.active,
        .admin-tab:hover {
            background: var(--gold);
            color: #0c0b09;
            border-color: var(--gold);
        }

        /* ========== CUSTOMER DETAIL ========== */
        .customer-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(205,164,94,0.1);
            margin-bottom: 15px;
        }

        .customer-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: #0c0b09;
        }

        /* ========== CHART CONTAINER ========== */
        .chart-container {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid rgba(205,164,94,0.1);
            margin-bottom: 25px;
        }

        .chart-container canvas {
            max-height: 300px;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 992px) {
            .sidebar {
                width: 70px;
            }
            .sidebar .nav-link span,
            .sidebar-logo h5,
            .sidebar-logo p,
            .sidebar-footer span {
                display: none;
            }
            .sidebar .nav-link {
                justify-content: center;
                padding: 14px;
            }
            .sidebar .nav-link i {
                font-size: 1.3rem;
            }
            .main-content {
                margin-left: 70px;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }
            .sidebar-menu {
                display: flex;
                flex-wrap: wrap;
                padding: 10px;
            }
            .sidebar-menu .nav-item {
                flex: 1;
                min-width: 80px;
            }
            .main-content {
                margin-left: 0;
            }
        }

        /* ========== TOAST ========== */
        .admin-toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--card-bg);
            border-left: 4px solid var(--gold);
            padding: 15px 25px;
            border-radius: 10px;
            z-index: 9999;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="admin-wrapper">
    <!-- ========== SIDEBAR ========== -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <img src="https://i.ibb.co/1JQyJGfH/logo.png" alt="Logo">
            <h5>Cheesy Crust Co.</h5>
            <small style="color: var(--text-muted);">Admin Panel</small>
        </div>
        
        <ul class="sidebar-menu">
            <li class="nav-item">
                <a class="nav-link active" data-section="dashboard" onclick="switchSection('dashboard')">
                    <i class="fas fa-th-large"></i> <span>Dashboard</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" data-section="orders" onclick="switchSection('orders')">
                    <i class="fas fa-shopping-cart"></i> <span>Orders</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" data-section="menu" onclick="switchSection('menu')">
                    <i class="fas fa-utensils"></i> <span>Menu Management</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" data-section="reservations" onclick="switchSection('reservations')">
                    <i class="fas fa-calendar-check"></i> <span>Reservations</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" data-section="customers" onclick="switchSection('customers')">
                    <i class="fas fa-users"></i> <span>Customers</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" data-section="reviews" onclick="switchSection('reviews')">
                    <i class="fas fa-star"></i> <span>Reviews</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" data-section="analytics" onclick="switchSection('analytics')">
                    <i class="fas fa-chart-bar"></i> <span>Analytics</span>
                </a>
            </li>
        </ul>
        
        <div class="sidebar-footer">
            <a href="index.html" class="btn-outline-gold" style="width: 100%; text-align: center; display: block;">
                <i class="fas fa-store"></i> <span>View Store</span>
            </a>
        </div>
    </aside>

    <!-- ========== MAIN CONTENT ========== -->
    <main class="main-content" id="mainContent">
        <!-- Content loaded dynamically -->
    </main>
</div>

<!-- Modals -->
<div class="modal fade admin-modal" id="orderDetailModal" tabindex="-1"></div>
<div class="modal fade admin-modal" id="menuItemModal" tabindex="-1"></div>
<div class="modal fade admin-modal" id="customerDetailModal" tabindex="-1"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
