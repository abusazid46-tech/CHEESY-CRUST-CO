services:
  - type: web
    name: cheesy-crust-api
    runtime: python
    buildCommand: |
      pip install --upgrade pip
      pip install pydantic==2.4.2 pydantic-core==2.10.1 --no-binary pydantic-core
      pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
